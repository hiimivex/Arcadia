# Arcadia : compilation Windows du moteur Switch / Switch 2 (Lichii modifié). Aucune release, aucune clé, aucun jeu.
name: arcadia-switch-lichii
on:
  push:
    branches: [arcadia-switch-lichii]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: LLVM (clang-cl, comme les compilations officielles de Lichii)
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1
      - name: Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1
      - name: Configurer
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DLICHII_TESTS=OFF \
            -DENABLE_QT=OFF -DLICHII_CMD=ON -DLICHII_ROOM=ON -DLICHII_ROOM_STANDALONE=ON \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF -DENABLE_WEB_SERVICE=OFF \
            -DLICHII_BUILD_PLATFORM=windows-x86_64 \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /OPT:REF /OPT:ICF" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"
      - name: Compiler
        shell: bash
        run: cmake --build build/release --target lichii-cmd lichii_room_standalone
      - name: Rassembler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/symboles
          exe=$(find build/release -name 'arcadia-switch.exe' | head -1)
          echo "exe: $exe"
          cp "$exe" out/
          room=$(find build/release -name 'arcadia-room.exe' | head -1)
          echo "room: $room"
          cp "$room" out/
          # bibliothèques Visual C++ à côté de l'exe (déploiement local autorisé par Microsoft) : rien à installer chez l'utilisateur
          crt=$(cygpath -u "$VCToolsRedistDir")/x64
          crtdir=$(ls -d "$crt"/Microsoft.VC*.CRT | head -1)
          echo "crt: $crtdir"
          for d in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll concrt140.dll; do
            [ -f "$crtdir/$d" ] && cp "$crtdir/$d" out/
          done
          dir=$(dirname "$exe")
          find "$dir" -maxdepth 1 -name '*.dll' -exec cp {} out/ \;
          pdb=$(find build/release -name 'arcadia-switch.pdb' | head -1 || true)
          if [ -n "$pdb" ]; then xz -9 -c "$pdb" > out/symboles/arcadia-switch.pdb.xz; fi
          ls -la out out/symboles
      - uses: actions/upload-artifact@v4
        with:
          name: arcadia-switch-windows
          path: out/
          retention-days: 14
