# Arcadia : compilation Windows du moteur Switch (eden-cli modifié). Aucune release, aucune clé, aucun jeu.
name: arcadia-switch
on:
  push:
    branches: [arcadia-switch]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configurer
        shell: pwsh
        run: |
          $env:VULKAN_SDK = "C:/VulkanSDK/1.4.341.1"
          $env:PATH = "$env:VULKAN_SDK/Bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_QT=OFF -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF -DYUZU_TESTS=OFF `
            -DENABLE_WEB_SERVICE=OFF -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF -DENABLE_WERROR=OFF `
            -DYUZU_CRASH_DUMPS=OFF -DENABLE_LIBUSB=OFF
      - name: Compiler
        shell: pwsh
        run: |
          $env:VULKAN_SDK = "C:/VulkanSDK/1.4.341.1"
          $env:PATH = "$env:VULKAN_SDK/Bin;$env:PATH"
          cmake --build build --target yuzu-cmd
      - name: Rassembler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build/bin -Recurse -Include *.exe,*.dll | Copy-Item -Destination out
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: arcadia-switch-windows
          path: out/
          retention-days: 14
